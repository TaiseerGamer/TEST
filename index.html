<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin & Food Gacha Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h2 id="auth-title">Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button id="auth-btn" onclick="handleAuth()">Login</button>
      <p class="toggle-text" onclick="toggleAuthMode()">Don't have an account? Sign Up</p>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <div id="game-screen" class="screen hidden">
    <header>
      <div>User: <b id="user-display"></b></div>
      <button onclick="logout()">Logout</button>
    </header>

    <main>
      <section class="clicker-section">
        <h2>Coins: $<span id="coin-count">0</span></h2>
        <div id="coin" onclick="clickCoin()">🪙</div>
      </section>

      <section class="shop-section">
        <h2>Food Boxes</h2>
        <div class="box-container">
          <div class="box-card">
            <h3>Basic Box</h3>
            <p>Cost: $10</p>
            <p><small>90% Common, 10% Rare</small></p>
            <button onclick="openBox('basic')">Open</button>
          </div>
          <div class="box-card">
            <h3>Super Box</h3>
            <p>Cost: $50</p>
            <p><small>50% Common, 35% Rare, 15% Legendary</small></p>
            <button onclick="openBox('super')">Open</button>
          </div>
          <div class="box-card">
            <h3>Ultra Box</h3>
            <p>Cost: $200</p>
            <p><small>10% Common, 40% Rare, 50% Legendary</small></p>
            <button onclick="openBox('ultra')">Open</button>
          </div>
        </div>
      </section>

      <section class="inventory-section">
        <h2>Inventory</h2>
        <div id="inventory-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
