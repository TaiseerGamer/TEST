<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Mystery Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Food Mystery Clicker</h1>
    <div class="stats-bar">$<span id="money-display">0</span></div>
  </header>

  <div class="main-container">
    <!-- Clicker -->
    <div class="section">
      <h2>Click for Money</h2>
      <div class="coin-container">
        <div class="coin" id="coin">🪙</div>
      </div>
      <p>Click the golden coin to earn $1</p>
    </div>

    <!-- Shop -->
    <div class="section">
      <h2>Box Shop</h2>
      <div class="shop-boxes" id="shop-container"></div>
      <div class="unboxed-result" id="result-display"></div>
    </div>

    <!-- Inventory -->
    <div class="section">
      <h2>Food Collection</h2>
      <div class="inventory-grid" id="inventory-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
