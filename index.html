<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Collector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🍔 Food Collector</h1>

        <div class="coins">
            🪙 <span id="coinCount">0</span>
        </div>
    </header>

    <!-- Main Game -->
    <main>

        <!-- Coin Section -->
        <section class="coin-section">
            <h2>Collect Coins</h2>

            <button id="coinButton" class="coin-button">
                🪙
            </button>

            <p>Click the coin to earn money!</p>
        </section>

        <!-- Shop -->
        <section class="shop-section">
            <h2>📦 Box Shop</h2>

            <div class="box-container">

                <div class="box-card">
                    <div class="box-icon">📦</div>
                    <h3>Basic Food Box</h3>
                    <p>Contains a random food!</p>
                    <p class="price">🪙 25</p>

                    <button class="buy-button" data-box="basic">
                        Buy Box
                    </button>
                </div>

            </div>
        </section>

        <!-- Box Opening -->
        <section id="openingSection" class="opening-section hidden">

            <h2>📦 Open Your Box!</h2>

            <div id="boxDisplay" class="box-display">
                📦
            </div>

            <button id="openButton" class="open-button">
                Open Box
            </button>

        </section>

        <!-- Result -->
        <section id="resultSection" class="result-section hidden">

            <h2>You Got!</h2>

            <div id="foodResult" class="food-result">
                🍔
            </div>

            <h3 id="foodName">Burger</h3>

            <p id="foodRarity">Common</p>

            <button id="collectButton">
                Add to Collection
            </button>

        </section>

        <!-- Collection -->
        <section class="collection-section">

            <h2>📖 Food Collection</h2>

            <div class="collection-info">
                <span id="collectionCount">0</span> / <span id="totalFoods">0</span>
                Foods Collected
            </div>

            <div id="collectionGrid" class="collection-grid">
                <!-- Foods will be generated here -->
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
