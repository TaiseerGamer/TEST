<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Collector Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Food Collector</h1>
    <div class="stats">
      <div>🪙 Coins: <span id="coin-count">0</span></div>
    </div>
  </header>

  <div class="game-layout">
    <div class="actions">
      <!-- Clickable Coin -->
      <button class="coin-btn" id="coin-btn" title="Click to earn coins!">🪙</button>

      <!-- Loot Box Section -->
      <div class="box-card">
        <div class="display-box" id="display-box">📦</div>
        <button class="buy-btn" id="buy-box-btn">Open Box (15 Coins)</button>
      </div>
    </div>

    <!-- Collection Area -->
    <div class="collection-container">
      <div class="collection-title">
        <span>Food Collection</span>
        <span id="collection-tracker">0 / 0</span>
      </div>
      <div class="grid" id="collection-grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
