<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coin Clicker: Food Collector v0.0.1</title>
    style.css
</head>
<body>

    <h1>🍀 Coin Clicker: Food Collector</h1>

    <div id="game">
        <button id="coin">💰 Click Coin</button>

        <p>Money: $<span id="money">0</span></p>
        <p>Foods Collected: <span id="foodCount">0</span></p>

        <p id="result">Open a box to get food!</p>

        <h2>📦 Buy Boxes</h2>

        <button onclick="buyBox('cheap')">
            Cheap Box ($8)
        </button>

        <button onclick="buyBox('expensive')">
            Expensive Box ($45)
        </button>

        <h2>🎒 Inventory</h2>
        <ul id="inventory"></ul>
    </div>

    script.jsscript>
</body>
</html>
