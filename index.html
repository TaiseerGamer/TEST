<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin & Crates</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div><p class="eyebrow">TAP • OPEN • COLLECT</p><h1>Coin & Crates</h1></div>
      <div class="wallet"><span>💰</span><strong id="money">0</strong><small>coins</small></div>
    </header>
    <section class="hero card">
      <div class="coin-area"><button id="coinButton" class="coin" aria-label="Press the coin to earn money"><span>¢</span></button><p>Press the coin!</p><div id="floaters" class="floaters"></div></div>
      <div class="stats"><div><span>Coins per tap</span><b id="tapPower">1</b></div><div><span>Foods collected</span><b id="foodCount">0</b></div><div><span>Best food</span><b id="bestFood">—</b></div></div>
    </section>
    <section><div class="section-heading"><div><p class="eyebrow">SPEND YOUR COINS</p><h2>Food boxes</h2></div><button id="resetButton" class="text-button">Reset game</button></div><div id="boxes" class="boxes"></div></section>
    <section class="card collection"><div class="section-heading"><div><p class="eyebrow">YOUR COLLECTION</p><h2>Food shelf</h2></div><span id="collectionHint" class="hint">Open a box to start</span></div><div id="collection" class="collection-grid"></div></section>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
