<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coin Clicker Food Boxes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🍀 Coin Clicker: Food Collector</h1>
  <div id="game">
    <button id="coin">💰 Click Coin</button>
    <p>Money: $<span id="money">0</span></p>

    <h2>Buy Boxes</h2>
    <button onclick="buyBox('cheap')">Cheap Box ($10)</button>
    <button onclick="buyBox('expensive')">Expensive Box ($50)</button>

    <h2>Inventory</h2>
    <ul id="inventory"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
